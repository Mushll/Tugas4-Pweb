<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="brand"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2v4L12 21l7-3.8v-4L12 17l-7-3.8z"/></svg><span>Student Management</span></div>
        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#" class="active">Students</a>
            <a href="#">About</a>
            <span class="avatar"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg></span>
        </nav>
    </header>

    <!-- LAYOUT UTAMA (GRID 2 KOLOM) -->
    <main class="container">

        <!-- KOLOM KIRI: FORM -->
        <section class="card">
            <h2>Form Student</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input type="text" id="nim" placeholder="Masukkan NIM">
                </div>
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label for="jurusan">Jurusan</label>
                    <select id="jurusan">
                        <option value="">Pilih Jurusan</option>
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Komputer</option>
                        <option>Manajemen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email">
                </div>

                <p id="message" class="message"></p>

                <div class="form-actions">
                    <button type="submit" id="btnSave" class="btn btn-primary"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 1v5h8V4H7zm5 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg><span id="saveLabel">Simpan</span></button>
                    <button type="button" id="btnCancel" class="btn btn-secondary">Batal</button>
                    <button type="reset" class="btn btn-danger"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg><span>Reset</span></button>
                </div>
            </form>
        </section>

        <!-- KOLOM KANAN: DATA -->
        <section class="card">
            <div class="table-header">
                <h2>Data Mahasiswa</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari mahasiswa...">
                    <button type="button" id="searchBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5.5 5.5"/></svg></button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NIM</th>
                        <th>Nama</th>
                        <th>Jurusan</th>
                        <th>Email</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="studentBody"></tbody>
            </table>

            <div class="pagination" id="pagination"></div>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
